name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a tagged main commit
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Verify release version and npm installer
        run: |
          set -euo pipefail
          node scripts/check-release-version.js "${GITHUB_REF_NAME}"
          npm --prefix npm test
          node --check npm/install.js
          node --check npm/run.js
          (cd npm && npm pack --dry-run)

      - name: Build web assets
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify and test Go code
        run: |
          set -euo pipefail
          go mod download
          go mod verify
          go build ./...
          go test -race ./...
          go test -tags=smoke ./tests/e2e/...
          go test -tags=regression ./tests/e2e/...
          go test ./tests/release_local/...
          go test -bench=. -benchmem -tags=performance ./tests/performance/...

  build-assets:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and verify six release archives
        run: |
          set -euo pipefail
          node scripts/check-release-version.js "${GITHUB_REF_NAME}"
          make release-all
          node scripts/check-release-assets.js dist

      - name: Upload verified release archives
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  publish:
    runs-on: ubuntu-latest
    needs: build-assets
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js for npm provenance
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Use a provenance-capable npm client
        run: npm install --global npm@11

      - name: Download verified build output
        uses: actions/download-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: dist

      - name: Revalidate downloaded artifacts
        run: |
          set -euo pipefail
          node scripts/check-release-version.js "${GITHUB_REF_NAME}"
          node scripts/check-release-assets.js dist

      - name: Publish or update the GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes="changelogs/${tag}.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.tar.gz dist/*.zip dist/checksums.txt --clobber
            gh release edit "$tag" --title "cc-connect-next ${tag}" --notes-file "$notes" --prerelease
          else
            gh release create "$tag" dist/*.tar.gz dist/*.zip dist/checksums.txt \
              --verify-tag \
              --title "cc-connect-next ${tag}" \
              --notes-file "$notes" \
              --prerelease
          fi

      - name: Verify public GitHub release downloads
        run: |
          set -euo pipefail
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          for asset in dist/*.tar.gz dist/*.zip dist/checksums.txt; do
            filename="$(basename "$asset")"
            curl --fail --location --retry 6 --retry-delay 5 \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${filename}" \
              --output "${verify_dir}/${filename}"
          done
          node scripts/check-release-assets.js "$verify_dir"

      - name: Publish npm beta idempotently
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if npm view "cc-connect-next@${version}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "cc-connect-next@${version} is already published"
          else
            npm publish --access public --tag beta --provenance
          fi

      - name: Verify the public npm registry
        working-directory: npm
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          published="$(npm view "cc-connect-next@${version}" version --registry=https://registry.npmjs.org)"
          test "$published" = "$version"
