name: CI

on:
  push:
    tags:
      - 'v*'

# CI is intentionally release-tag driven. Pull requests and branch pushes do not
# start this workflow; the release workflow performs the publication checks for
# the same v* tag.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web assets
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Verify release metadata and npm installer
        run: |
          set -euo pipefail
          node scripts/check-release-version.js
          node --test scripts/*.test.js
          npm --prefix npm test
          node --check npm/install.js
          node --check npm/run.js
          (cd npm && npm pack --dry-run)

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Lint code
        run: |
          set -euo pipefail
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
          LINT_BIN="$(go env GOPATH)/bin/golangci-lint"

          run_lint() {
            "$LINT_BIN" run "$@" || {
              code=$?
              # exit code 5 = "no go files to analyze" (e.g. only non-Go files changed) — not a lint failure
              [ "$code" -eq 5 ] && return 0
              return "$code"
            }
          }

          run_lint ./...

      - name: Lint GitHub workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.8
          "$(go env GOPATH)/bin/actionlint" -color

  unit-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web assets
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download dependencies
        run: go mod download
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
          GONOSUMDB: ""

      - name: Verify module checksums
        run: go mod verify
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
          GONOSUMDB: ""

      - name: Build
        run: go build ./...

      - name: Run tests with race detector
        run: go test ./... -race

  e2e-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run smoke tests
        run: go test -tags=smoke,no_web ./tests/e2e/...

      - name: Run regression tests
        run: go test -tags=regression,no_web ./tests/e2e/...

  performance-test:
    runs-on: ubuntu-latest
    # Benchmarks run as part of the release-tag verification path.

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run performance benchmarks
        run: go test -bench=. -benchmem -tags=performance,no_web ./tests/performance/...
