# =============================================================================
# Project: Using DeepSeek Harness (dsh) / 项目：使用 DeepSeek Harness (dsh)
# =============================================================================
# Bridges cc-connect to a RUNNING dsh web server on the same machine. Start
# the server first: `dsh web` (default http://127.0.0.1:3080). Sessions are
# created in the project's work_dir, so each cc-connect project maps to its
# own dsh session and resumes automatically.
# 需要先在本机启动 dsh web 服务（默认 http://127.0.0.1:3080）。会话以项目的
# work_dir 为工作目录创建，每个 cc-connect 项目对应一个 dsh 会话，自动续聊。
#
# Details / 详细说明: agent/dsh/README.md
# Optional options / 可选参数:
#   base_url      dsh web server URL (default "http://127.0.0.1:3080")
#                  dsh web 服务地址（默认 "http://127.0.0.1:3080"）
#   token         launch token from dsh web; also accepts DSH_TOKEN
#                 dsh web 输出的启动令牌，也可通过 DSH_TOKEN 环境变量配置
#                 A token selects the authenticated Remote API (DSH 0.2.1-rc.2).
#                 有令牌时使用认证 Remote API；无令牌时保留旧协议。
#   agent_preset  dsh agent preset for new sessions (optional)
#                 新会话使用的 dsh agent preset（可选）
#   model         "provider/model" override applied at session start (optional)
#                  会话启动时应用的 "provider/model" 模型覆盖（可选）
#   reasoning_effort  reasoning-effort override ("off"/"high"/"max" or the
#                   model's advertised efforts), applied at session start
#                   (optional) / 会话启动时应用的推理强度覆盖（可选）
#   mode          permission mode: "default" | "yolo" | "plan" (optional)
#                  权限模式：default（默认）/ yolo（全自动）/ plan（只读规划）
#                  映射到 dsh 的 /permission 预设（workspace-write /
#                  danger-full-access / read-only），必须支持会话级命令，
#                  不会回退修改整个服务的默认权限。
#   timeout_mins  per-turn timeout in minutes (0 = unlimited, default)
#                  单轮超时分钟数（0 = 不限时，默认）
#
# Note: make sure the `cc-connect` binary is on the PATH of the dsh server
# process so cron/timer/relay CLI calls from inside dsh sessions work.
# 注意：请确保 dsh 服务进程的 PATH 中包含 cc-connect 二进制，dsh 会话内调用
# cron/timer/relay 命令时才可正常工作。
#
# Recommended: enable Card 2.0 rich mode for the best streaming UX
# (typewriter text, collapsible thinking, tool steps). Platforms without
# rich-card support fall back to legacy automatically.
# 推荐开启富卡片模式获得最佳流式体验（打字机文本、可折叠思考、工具步骤），
# 不支持的平台会自动回退 legacy。
# [display]
#   card_mode = "rich"

# [[projects]]
# name = "my-dsh-project"
#
# [projects.agent]
# type = "dsh"
#
# [projects.agent.options]
# work_dir = "/path/to/your/project"
# base_url = "http://127.0.0.1:3080"
# # Set DSH_TOKEN in the environment, or fill in the empty option below.
# # token = ""
# # Remote handshake tokens may appear in server/proxy access logs.
# # Use HTTPS outside loopback; plain HTTP exposes the token on the network.
# # agent_preset = "standard"
# # model = "deepseek-official/deepseek-flash"
# # timeout_mins = 30
